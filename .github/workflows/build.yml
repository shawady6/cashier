name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      stable:
        description: "انشر هذا البيلد أيضًا في قناة التحديث المستقرة"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from build number
        run: node scripts/set-version.mjs "0.1.${{ github.run_number }}"

      - name: Install frontend dependencies
        run: npm install

      - name: Validate signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $key = ($env:TAURI_SIGNING_PRIVATE_KEY -replace '\s', '')
          $pw = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          if ($null -ne $pw) { $pw = $pw.TrimEnd("`r", "`n") }
          $problem = $null
          try {
            $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
            $header = ($text -split "`n")[0].Trim()
            Write-Host "key length: $($key.Length)"
            Write-Host "key header: $header"
            if ($header -notmatch 'secret key') { $problem = "TAURI_SIGNING_PRIVATE_KEY ليس مفتاحًا خاصًا (الرأس: $header). الصق محتوى pos.key وليس pos.key.pub" }
          } catch {
            $problem = "TAURI_SIGNING_PRIVATE_KEY ليس base64 صالحًا. الصق محتوى pos.key كاملًا"
          }
          if (-not $problem) {
            "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            $env:TAURI_SIGNING_PRIVATE_KEY = $key
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $pw
            'probe' | Set-Content probe.txt
            npx tauri signer sign probe.txt
            if ($LASTEXITCODE -ne 0) { $problem = "كلمة السر TAURI_SIGNING_PRIVATE_KEY_PASSWORD لا تطابق المفتاح" }
          }
          if ($problem) {
            Write-Host "::warning::$problem. سيُبنى البرنامج بدون توقيع وبدون تحديثات."
            "TAURI_SIGNING_PRIVATE_KEY=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "مفتاح التوقيع سليم"
          }

      - name: Typecheck and build frontend
        run: npm run build

      - name: Generate app icons
        run: npx tauri icon app-icon.svg

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows app (signed updates)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: npx tauri build

      - name: Build Windows app (unsigned, updater disabled)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path no-updater.json
          npx tauri build --config no-updater.json

      - name: Collect release files
        shell: pwsh
        run: |
          $ver = "0.1.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/pos-system.exe release/pos-system.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "release/POS-System_${ver}_x64-setup.exe"
          if (Test-Path "$($setup.FullName).sig") {
            Copy-Item "$($setup.FullName).sig" "release/POS-System_${ver}_x64-setup.exe.sig"
          }
          Get-ChildItem release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cashier-windows
          path: release/*
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: |
            release/pos-system.exe
            release/POS-System_*_x64-setup.exe

      - name: Create update feed (latest.json)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $ver = "0.1.${{ github.run_number }}"
          $name = "POS-System_${ver}_x64-setup.exe"
          $sig = (Get-Content "release/$name.sig" -Raw).Trim()
          $notes = ($env:COMMIT_MESSAGE -split "`n")[0]
          $feed = [ordered]@{
            version  = $ver
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/$name"
              }
            }
          }
          New-Item -ItemType Directory -Force -Path feed | Out-Null
          [IO.File]::WriteAllText("$PWD/feed/latest.json", ($feed | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding $false))
          Get-Content feed/latest.json

      - name: Publish test channel feed
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: channel-test
          name: Update channel (test)
          prerelease: true
          make_latest: false
          files: feed/latest.json

      - name: Publish stable channel feed
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && inputs.stable == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: channel-stable
          name: Update channel (stable)
          prerelease: true
          make_latest: false
          files: feed/latest.json
